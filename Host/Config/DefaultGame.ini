; The host's committed config: only what the packaged game needs. The rest of Config/ is what the editor writes on
; its first start, and stays out of git (.gitignore).

; The Blueprint graphs -OWGraph runs (written to Content/OW/ by -run=OWMakeGraph) and the material -OWFrame draws with
; (Content/OW/M_OWFrame, by -run=OWMakeFrame) reach the pak although no map references them: the cook requests every
; package under this path (CookCommandlet.cpp, CookOnTheFlyServer.cpp). The engine's plane and sphere -OWFrame lays a
; map out with are loaded by path, never referenced, so their folder is listed too (a path starting with / keeps its
; own root, PackageName.cpp's TryConvertGameRelativePackagePathToLocalPath).
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/OW")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
